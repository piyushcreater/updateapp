<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyApp Classic - All Versions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7fe;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .app-logo {
            width: 80px;
            height: 80px;
            background: #4e73df;
            color: white;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        h1 {
            font-size: 26px;
            color: #2e3e5c;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #7d879c;
        }
        
        /* Version List Styling */
        .version-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .version-card {
            background: #f8f9fc;
            border: 1px solid #e3e6f0;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.2s;
        }
        .version-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        /* Latest version ko alag look dene ke liye */
        .version-card.latest {
            border-left: 5px solid #4e73df;
            background: #fffbf7; /* Light premium background */
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .version-number {
            font-size: 18px;
            font-weight: bold;
            color: #2e3e5c;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.latest {
            background: #4e73df;
            color: white;
        }
        .badge.old {
            background: #858796;
            color: white;
        }
        .release-date {
            font-size: 12px;
            color: #a3a6b5;
            display: block;
            margin-bottom: 10px;
        }
        .changelog-title {
            font-size: 14px;
            font-weight: 600;
            color: #4e5e7a;
            margin-bottom: 6px;
        }
        .changelog {
            list-style-type: disc;
            margin-left: 20px;
            font-size: 14px;
            color: #5a5c69;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .btn-download {
            display: inline-block;
            background: #4e73df;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-download:hover {
            background: #2e59d9;
        }
        .btn-download.old-btn {
            background: #eaecf4;
            color: #4e73df;
            border: 1px solid #d1d3e2;
        }
        .btn-download.old-btn:hover {
            background: #dddfeb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="app-logo">SC</div>
        <h1>StudyApp Classic</h1>
        <p class="subtitle">Sare versions aur updates ki list yahan hai.</p>
    </div>

    <!-- Yahan saare versions automatic load honge -->
    <div class="version-list" id="versionListContainer"></div>
</div>

<script>
    // 1. APNA DATA YAHAN DALO (Sabse naya version sabse upar rakhein)
    const allVersions = [
        {
            version: "v1.3.2",
            date: "23 May 2026",
            type: "latest", // latest ya old
            downloadLink: "https://link-to-your-storage.com/studyapp-v1.3.2.apk",
            changes: [
                "Naya Live Quiz features add kiya gaya hai.",
                "App crash hone ki dikkat ko solve kiya gaya.",
                "UI ko pehle se zyada smooth banaya gaya hai."
            ]
        },
        {
            version: "v1.2.0",
            date: "15 April 2026",
            type: "old",
            downloadLink: "https://link-to-your-storage.com/studyapp-v1.2.0.apk",
            changes: [
                "PDF Downloader option joda gaya.",
                "Dark Mode ka pehla beta update.",
                "Purani login bug fix ki gayi."
            ]
        },
        {
            version: "v1.0.0",
            date: "01 March 2026",
            type: "old",
            downloadLink: "https://link-to-your-storage.com/studyapp-v1.0.0.apk",
            changes: [
                "StudyApp Classic ka pehla official release! 🎉",
                "Basic Notes aur Study Material section."
            ]
        }
    ];

    // 2. Data ko HTML me convert karne ka script
    const container = document.getElementById('versionListContainer');

    allVersions.forEach(item => {
        // Card Div banana
        const card = document.createElement('div');
        card.className = `version-card ${item.type === 'latest' ? 'latest' : ''}`;

        // Changes list taiyar karna
        let changesHTML = '';
        item.changes.forEach(change => {
            changesHTML += `<li>${change}</li>`;
        });

        // Badge aur Button ka style set karna
        const badgeClass = item.type === 'latest' ? 'badge latest' : 'badge old';
        const badgeText = item.type === 'latest' ? 'Latest Update' : 'Older Version';
        const btnClass = item.type === 'latest' ? 'btn-download' : 'btn-download old-btn';

        // HTML structure map karna
        card.innerHTML = `
            <div class="card-header">
                <div class="version-number">Version ${item.version}</div>
                <span class="${badgeClass}">${badgeText}</span>
            </div>
            <span class="release-date">Released on: ${item.date}</span>
            <div class="changelog-title">Kya naya hai:</div>
            <ul class="changelog">
                ${changesHTML}
            </ul>
            <a href="${item.downloadLink}" class="${btnClass}">Download APK</a>
        `;

        // Container me add karna
        container.appendChild(card);
    });
</script>

</body>
</html>
